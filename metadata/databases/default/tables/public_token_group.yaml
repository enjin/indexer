table:
  name: token_group
  schema: public
object_relationships:
  - name: collection
    using:
      foreign_key_constraint_on: collection_id
array_relationships:
  - name: attributes
    using:
      foreign_key_constraint_on:
        column: token_group_id
        table:
          name: attribute
          schema: public
  - name: tokenGroupTokens
    using:
      foreign_key_constraint_on:
        column: token_group_id
        table:
          name: token_group_token
          schema: public
remote_relationships:
  - name: metadata
    definition:
      to_remote_schema:
        remote_schema: indexer_extensions
        lhs_fields:
          - id
        remote_field:
          resolveTokenGroupMetadata:
            arguments:
              id: $id
select_permissions:
  - role: public
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
