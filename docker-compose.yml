services:
  indexer_db:
    container_name: indexer_db
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - indexer_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    shm_size: 10gb
    command: [
      "postgres",
      "-c", "max_connections=200",
      "-c", "shared_buffers=7GB",
      "-c", "shared_preload_libraries=pg_stat_statements",
      "-c", "logging_collector=on",
      "-c", "log_directory=/var/log/postgresql",
      "-c", "log_filename=postgresql.log",
      "-c", "log_line_prefix='%m [%p] %q[user=%u,db=%d,app=%a] '"
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  indexer_redis:
    container_name: indexer_redis
    restart: unless-stopped
    image: redis:7
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - redis_db:/data
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  indexer_processor:
    container_name: indexer_processor
    restart: unless-stopped
    image: ghcr.io/enjin/indexer:${VERSION:-latest}
    environment:
      CONTAINER_ROLE: processor
      TRUNCATE_DATABASE: ${TRUNCATE_DATABASE}
    build:
      context: .
      args:
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    volumes:
      - .env:/app/.env
    depends_on:
      - indexer_db

  indexer_hasura:
    container_name: indexer_hasura
    restart: unless-stopped
    image: hasura/graphql-engine:${HASURA_VERSION:-v2.49.5}.cli-migrations-v3
    environment:
      HASURA_GRAPHQL_DATABASE_URL: "postgres://${DB_USER:-postgres}:${DB_PASS}@${DOCKER_DB_HOST:-indexer_db}:${DB_PORT:-5432}/${DB_NAME}"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-local-development-secret}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: ${HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES:-true}
      HASURA_GRAPHQL_ENABLE_SUBSCRIPTIONS: "true"
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-true}
      HASURA_GRAPHQL_DEV_MODE: ${HASURA_GRAPHQL_DEV_MODE:-true}
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log,query-log
      HASURA_EXTENSION_GRAPHQL_URL: http://indexer_extensions:4001/graphql
      HASURA_EXTENSION_SECRET: ${HASURA_EXTENSION_SECRET:-local-extension-secret}
    volumes:
      - ./metadata:/hasura-metadata:ro
      - ./hasura-migrations:/hasura-migrations:ro
    ports:
      - "8085:8080"
    depends_on:
      indexer_db:
        condition: service_healthy
      indexer_extensions:
        condition: service_healthy

  indexer_extensions:
    container_name: indexer_extensions
    restart: unless-stopped
    image: ghcr.io/enjin/indexer:${VERSION:-latest}
    env_file:
      - .env
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-indexer_db}
      DB_PORT: ${DB_PORT:-5432}
      CONTAINER_ROLE: extensions
      REDIS_URL: redis://indexer_redis:6379
      EXTENSION_GRAPHQL_PORT: "4001"
      HASURA_EXTENSION_SECRET: ${HASURA_EXTENSION_SECRET:-local-extension-secret}
    build:
      context: .
    expose:
      - "4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/graphql',{method:'POST',headers:{'content-type':'application/json','x-indexer-extension-secret':process.env.HASURA_EXTENSION_SECRET||''},body:JSON.stringify({query:'{__typename}'})}).then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      indexer_db:
        condition: service_healthy
      indexer_redis:
        condition: service_healthy

  indexer_graphql:
    container_name: indexer_graphql
    restart: unless-stopped
    image: ghcr.io/enjin/indexer:${VERSION:-latest}
    environment:
      CONTAINER_ROLE: graphql
    build:
      context: .
    ports:
      - "4000:4000"
      - "8080:8080"
    volumes:
      - .env:/app/.env
    depends_on:
      - indexer_db

  indexer_worker:
    container_name: indexer_worker
    restart: unless-stopped
    image: ghcr.io/enjin/indexer:${VERSION:-latest}
    environment:
      CONTAINER_ROLE: worker
    build:
      context: .
    ports:
      - "9090:9090"
    volumes:
      - .env:/app/.env
    depends_on:
      - indexer_db
      - indexer_redis

volumes:
  indexer_db:
  redis_db:
